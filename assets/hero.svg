    .label { fill: #1D1D1F; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .meta { fill: #6E6E73; font: 450 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .6px; }
