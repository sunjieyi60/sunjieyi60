<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">sunjieyi60 — Build systems that stay understandable.</title>
  <desc id="desc">A calm blue profile banner with a modular system diagram.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #F5F5F7; }
    .grid { stroke: #1D1D1F; stroke-opacity: .055; }
    .eyebrow { fill: #6E6E73; font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2.4px; }
    .title { fill: #1D1D1F; font: 700 54px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -2.2px; }
    .subtitle { fill: #6E6E73; font: 450 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .line { stroke: #007AFF; stroke-width: 2; stroke-linecap: round; opacity: .42; }
    .card { fill: #FFFFFF; stroke: #1D1D1F; stroke-opacity: .09; }
